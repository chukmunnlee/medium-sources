---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: active-volatile-app-httproute
spec:
  hostnames:
  - volatile-app.172.25.39.200.nip.io
  parentRefs:
  - sectionName: http
    name: default-gtw
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: volatile-app
      port: 5000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: preview-volatile-app-httproute
spec:
  hostnames:
    - preview.volatile-app.172.25.39.200.nip.io
  parentRefs:
  - sectionName: http
    name: default-gtw
    namespace: default
    port: 80
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: preview-volatile-app
      port: 5000


